name: Feature request
description: Propose an improvement or new component
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case or limitation should this change address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, behavior, and composition you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility considerations
      description: Note relevant semantics, keyboard behavior, focus handling, or motion behavior.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and the component inventory for similar functionality.
          required: true
