<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f8fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1018" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="rui Docs" />
    <meta name="description" content="Documentation and component reference for @bzync/rui, a production-ready React component library built with Tailwind CSS." />
    <title>Introduction – @bzync/rui</title>
    <script>
      (function() {
        try {
          var k = 'rui-docs-theme';
          var t = localStorage.getItem(k);
          var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var r = t === 'light' || t === 'dark' ? t : sysDark ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', r === 'dark');
          document.documentElement.dataset.theme = r;
          document.documentElement.style.colorScheme = r;
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
